[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-idem"
version = "0.1.0"
description = "Stripe-style request idempotency for Django REST Framework — replay stored responses, reject key reuse, resolve races."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hossam Rakha" }]
keywords = ["django", "drf", "idempotency", "api", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.15",
]

[project.urls]
Repository = "https://github.com/hossam1244/django-idem"
Issues = "https://github.com/hossam1244/django-idem/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "coverage>=7.6",
    "pytest-mock>=3.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_idem"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/django_idem"]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
